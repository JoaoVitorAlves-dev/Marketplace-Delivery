secret.api.key.marketplace=${JWT_SECRET}
api.token.expiration-ms=3600000

spring.datasource.url=jdbc:mysql://localhost:3306/marketplace
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=INFO
logging.level.joao.alves.delivery.marketplace=INFO